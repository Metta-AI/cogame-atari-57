  function clearFeed() { feedEl.innerHTML = ''; }

  // ---------- banner lane queue (one at a time, min hold) ----------
  var bannerEl = $('bannerlane');
  var bannerQueue = [];
  var bannerBusy = false;
  function banner(text, cls) {
    bannerQueue.push({ text: text, cls: cls });
    pumpBanner();
  }
  function pumpBanner() {
    if (bannerBusy || !bannerQueue.length) return;
    bannerBusy = true;
    var b = bannerQueue.shift();
    var chip = document.createElement('div');
    chip.className = 'banner-chip ' + b.cls;
    chip.textContent = b.text;
    bannerEl.appendChild(chip);
    // lever 1 (animFactor cap): the pop-in never plays faster than 2x, so a
    // fast-forward scrub can't reduce a banner to a subliminal flash.
    chip.style.animationDuration = (300 / animFactor()) + 'ms';
    var hold = dwellFloor('banner'); // lever 2: wall-clock dwell floor (~1.9s)
    setTimeout(function () {
      chip.classList.add('leaving');
      setTimeout(function () {
        if (chip.parentNode) chip.parentNode.removeChild(chip);
        bannerBusy = false;
        pumpBanner();
      }, 260);
    }, hold);
  }
  function clearBanners() {
    bannerQueue = [];
    bannerEl.innerHTML = '';
    bannerBusy = false;
  }

  // (scrubber beat markers — markBeat / killMarkerTeam / renderBeatMarkers —
  // live in the shared chrome — chrome_common.js)

  // (momentum graph — recordMomentum / renderMomentum and their state —
  // lives in the shared chrome — chrome_common.js)

  // ============================================================
  //  End-card (§5/§8) — the END SEGMENT: verdict, win condition and match
  //  stats, held on screen by the server for ~10s before a looping restart.
  //  Reads isDraw BEFORE winner (F4); names the key (F3).
  // ============================================================
  function overLives(o, team) {
    // A team's final lives from the verdict frame: the team-keyed map when
    // present, else the legacy red/blue scalars.
    if (o.teams && o.teams[team]) return o.teams[team].lives || 0;
    return team === 'red' ? (o.redLives || 0) : team === 'blue' ? (o.blueLives || 0) : 0;
  }

  function endcardWinCondition(o, teams) {
    // The condition CHIP: how the match ended, in two or three words.
    // (A time-limit ending is always a draw in the current rules — the sim's
    // checkMaxTicks path never crowns a winner — so timeLimit only pairs
    // with draw here.)
    if (o.endRule !== undefined) {
      // The cabinet names the RULE the server actually applied, so the chip can
      // never disagree with the endRule in results.json.
      switch (o.endRule) {
        case 'all_lanes_over': return 'EVERY CREDIT SPENT';
        case 'wall_clock': return 'WALL-CLOCK STOP';
        case 'sim_fault':
        case 'host_error': return 'FAULT — NO RESULT';
        default: return 'FULL TIME — HIGH SCORE TAKES IT';
      }
    }
    if (o.draw) return o.timeLimit ? 'TIME LIMIT — DRAW' : 'DRAW';
    var losers = teams.filter(function (t) { return t !== o.winner; });
    var bestLoser = 0;
    losers.forEach(function (t) { bestLoser = Math.max(bestLoser, overLives(o, t)); });
    return bestLoser <= 0 ? 'ELIMINATION' : 'HEART CAPTURE';
  }

  function endcardOrder(a, b) {
    // Kills lead the board; fewer deaths, then captures, break ties.
    return (b.k || 0) - (a.k || 0) || (a.d || 0) - (b.d || 0) ||
      (b.cap || 0) - (a.cap || 0) || a.s - b.s;
  }

  function endcardBadge(cls, count, title) {
    // One honor icon; repeat events fold into a ·N suffix instead of stacking.
    if (!count) return '';
    return '<span class="ec-badge ' + cls + '" title="' + title + '">' +
      (count > 1 ? '·' + count : '') + '</span>';
  }

  // Which hearts each seat captured, keyed by join slot: fed by the up-front
  // beat timeline (replays ship every capture on the first HUD frame) and by
  // live capture events, deduped by tick|slot so the two paths never
  // double-count one capture (a loop restart re-fires both, harmlessly).
  var capHeartsBySlot = {};
  var capHeartsSeen = {};
  function recordCapHeart(e) {
    if (e.by == null || e.by < 0 || !e.flag) return;
    var key = e.t + '|' + e.by;
    if (capHeartsSeen[key]) return;
    capHeartsSeen[key] = true;
    (capHeartsBySlot[e.by] = capHeartsBySlot[e.by] || []).push(e.flag);
  }
  function ingestCapHearts(s) {
    if (!s.beats) return;
    for (var i = 0; i < s.beats.length; i++) {
      if (s.beats[i].k === 'capture') recordCapHeart(s.beats[i]);
    }
  }

  function capturedHeartHtml(heartTeam) {
    // One captured heart, drawn as the captured team's own heart art (its
    // baked pixel art); a team without baked art gets a tinted glyph.
    if (heartTeam === 'red' || heartTeam === 'blue' ||
        heartTeam === 'green' || heartTeam === 'yellow') {
      return '<span class="ec-heart ' + heartTeam + '" title="Captured the ' + heartTeam + ' heart"></span>';
    }
    return '<span class="ec-heart-glyph" title="Captured an enemy heart">♥</span>';
  }

  function capturedHeartsHtml(s, p) {
    // The Cap column renders EVERY captured heart, one per capture — a 4-team
    // match (GV32: a capture eliminates its team and play continues) can see
    // one seat retire two or three rival hearts. The beat timeline names each
    // heart; when it can't (older servers ship no beats), fall back to the
    // roster's capture count, colored as the enemy heart only when two teams
    // make that unambiguous.
    var caps = p.cap || 0;
    if (caps <= 0) return '';
    var flags = capHeartsBySlot[p.s] || [];
    if (flags.length < caps) {
      var teams = activeTeams(s);
      var enemy = teams.length === 2 ? (teams[0] === p.team ? teams[1] : teams[0]) : null;
      flags = [];
      for (var i = 0; i < caps; i++) flags.push(enemy);
    }
    return flags.map(capturedHeartHtml).join('');
  }

  function renderEndcardRows(s, team, el, mvpSlot) {
    // Final per-player stat lines, top killer first. The MVP (winning team's
    // best line) reads in amber — no star prefix, it would break the name
    // column's alignment. Clstr counts grenade/spray multi-kill events; the
    // Cap column renders each captured heart itself, one per capture, in the
    // captured team's color; a dagger icon marks
    // teammate kills. A mixed team (2+ policies) groups its rows under policy
    // subheaders so each policy's contribution reads separately.
    var rows = (s.roster || []).filter(function (p) { return p.team === team; })
      .slice().sort(endcardOrder);
    var pols = teamPolicies(s, team);
    var grouped = pols.length > 1 && pols.length <= 4;
    var html = '';
    function rowHtml(p) {
      var mvp = mvpSlot != null && p.s === mvpSlot;
      if (A57_MODE) {
        // THE CABINET: the row is a SEAT, named by its REAL policy (the
        // endcard is spectator side), with the numbers a score-attack board
        // is decided on — points banked, lives unspent, screens cleared, and
        // how many of its 24 turns the LLM actually answered.
        return '<div class="ec-row' + (mvp ? ' mvp' : '') + '">' +
          '<span class="pcell">' +
          '<span class="pname">' + esc(shortName(rosterName(s, p.s))) + '</span>' +
          (p.record ? '<span class="ec-rec" title="Beat the cabinet record">REC</span>' : '') +
          '</span>' +
          '<span class="n">' + (p.points || 0) + '</span>' +
          '<span class="n">' + (p.lives || 0) + '</span>' +
          '<span class="n">' + (p.screensCleared || 0) + '</span>' +
          '<span class="n clstr">' + (p.llmTurns || 0) + '</span>' +
          '</div>';
      }
      var marks = endcardBadge('bs', p.tk, 'Backstab — killed a teammate');
      var cluster = (p.mk2 || 0) + (p.mk3 || 0);
      return '<div class="ec-row' + (mvp ? ' mvp' : '') + '">' +
        '<span class="pcell">' +
        '<span class="pname">' + esc(shortName(rosterName(s, p.s))) + '</span>' +
        marks +
        '</span>' +
        '<span class="n">' + (p.k || 0) + '</span>' +
        '<span class="n">' + (p.d || 0) + '</span>' +
        '<span class="n clstr">' + (cluster > 0 ? cluster : '') + '</span>' +
        '<span class="n cap">' + capturedHeartsHtml(s, p) + '</span>' +
        '</div>';
    }
    if (grouped) {
      pols.forEach(function (pol) {
        html += '<div class="ec-pol">' + esc(teamHeadline(pol)) + '</div>';
        rows.forEach(function (p) {
          var pp = p.pol != null ? p.pol : stripSeatSuffix(p.name);
          if (pp === pol) html += rowHtml(p);
        });
      });
    } else {
      rows.forEach(function (p) { html += rowHtml(p); });
    }
    el.innerHTML = html;
  }

  // Rebuild the endcard's per-team stat panels when the active team set
  // changes (once per match in practice): one panel per team, in display order.
  var ecTeams = null;
  function ensureEndcardTeams(teams) {
    var key = teams.join(',') + (A57_MODE ? '|a57' : '');
    if (ecTeams === key) return;
    ecTeams = key;
    var wrap = $('ec-teams');
    wrap.innerHTML = '';
    teams.forEach(function (team) {
      var el = document.createElement('div');
      el.className = 'ec-team';
      el.id = 'ec-team-' + team;
      el.innerHTML = A57_MODE
        ? '<div class="ec-tname ' + team + '" id="ec-tname-' + team + '">' + team.toUpperCase() + '</div>' +
          '<div class="ec-lives">' +
          '<span class="fl-num ' + team + '" id="ec-' + team + '">0.000</span>' +
          '<span class="fl-cap">Score</span>' +
          '</div>' +
          '<div class="ec-thead"><span>Policy</span><span>Pts</span><span>Lives</span>' +
          '<span>Scr</span><span>LLM</span></div>' +
          '<div id="ec-rows-' + team + '"></div>'
        : '<div class="ec-tname ' + team + '" id="ec-tname-' + team + '">' + team.toUpperCase() + '</div>' +
          '<div class="ec-lives">' +
          '<span class="fl-num ' + team + '" id="ec-' + team + '">0</span>' +
          '<span class="fl-cap">Lives left</span>' +
          '</div>' +
          '<div class="ec-thead"><span>Player</span><span>K</span><span>D</span><span>Clstr</span><span>Cap</span></div>' +
          '<div id="ec-rows-' + team + '"></div>';
      wrap.appendChild(el);
    });
  }

  function renderEndcard(s) {
    var card = $('endcard');
    if (!s.over) return;
    card.classList.add('on'); // own the frame at GameOver (§8) — before either verdict branch
    var o = s.over;
    var teams = activeTeams(s);
    ensureEndcardTeams(teams);

    // The loop countdown ticks every second while everything else is frozen,
    // so it renders unconditionally; the static content is keyed and only
    // rebuilt when the verdict frame actually changes (24fps hold, no churn).
    $('ec-replay').innerHTML = s.lp && s.hold > 0
      ? 'Replaying in <b>' + s.hold + '</b>' : '';

    var key = [s.mx, o.winner, o.draw, o.timeLimit, (s.roster || []).length].join('|');
    if (card._key === key) return;
    card._key = key;

    var head = $('ec-headline'), how = $('ec-how');
    $('ec-wincond').textContent = endcardWinCondition(o, teams);

    // MVP: the winning team's best final line (kills > fewer deaths >
    // captures — the capturer keeps their ⚑ mark, the star follows the guns).
    // A draw crowns nobody — the fidelity rules never invent a distinction the
    // sim didn't make (F4).
    var mvpSlot = null;
    if (!o.draw) {
      var winners = (s.roster || []).filter(function (p) { return p.team === o.winner; })
        .sort(endcardOrder);
      if (winners.length) mvpSlot = winners[0].s;
    }
    teams.forEach(function (team) {
      $('ec-' + team).textContent = A57_MODE
        ? Number((((o.teams || {})[team] || {}).score) || 0).toFixed(3)
        : overLives(o, team);
      $('ec-tname-' + team).textContent = teamName(s, team, team.toUpperCase());
      $('ec-team-' + team).classList.toggle('win', !o.draw && o.winner === team);
      renderEndcardRows(s, team, $('ec-rows-' + team), mvpSlot);
    });

    if (A57_MODE) {
      // THE CABINET: the verdict is the high score, and it always names the
      // cartridge, because which ROM was loaded is the round's headline.
      var win57 = o.winner;
      var winRow = (o.teams || {})[win57] || {};
      var romLine = String(o.rom || '').toUpperCase() + ' · par ' +
        (o.par || 0) + ' · ' + String(o.reason || '') + '/' +
        String(o.endRule || '');
      var win57Name = teamName(s, win57, String(win57).toUpperCase());
      head.className = 'headline ' + win57;
      head.textContent = win57Name + ' HIGH SCORE';
      how.textContent = String(win57).toUpperCase() + ' — ' +
        Number(winRow.score || 0).toFixed(3) + ' (' + (winRow.points || 0) +
        ' pts, ' + (winRow.lives || 0) + ' lives left) · ' + romLine;
      return;
    }
    if (o.draw) {
      head.className = 'headline draw';
      head.textContent = 'DRAW — NO SCORE';
      how.textContent = o.timeLimit
        ? 'Time expired before a capture or a wipe — a scoreless draw, with no tiebreak on lives.'
        : 'The match ended with neither side scoring — no winner.';
      return;
    }

    var winner = o.winner;
    var winName = teamName(s, winner, String(winner).toUpperCase());
    head.className = 'headline ' + winner;
    head.textContent = winName + ' WINS';

    var losers = teams.filter(function (t) { return t !== winner; });
    var winL = overLives(o, winner);
    var bestLoser = 0;
    losers.forEach(function (t) { bestLoser = Math.max(bestLoser, overLives(o, t)); });

    if (o.timeLimit) {
      // Time-limit resolution — name the key and the values (F3).
      if (winL !== bestLoser) {
        how.textContent = 'Time expired — ' + winName + ' held more lives (' + winL + ' vs ' + bestLoser + ').';
      } else {
        how.textContent = 'Time expired — lives tied; ' + winName + ' won on heart progress.';
      }
    } else {
      if (bestLoser <= 0) {
        head.textContent = losers.length === 1
          ? winName + ' WIPES OUT ' +
            teamName(s, losers[0], String(losers[0]).toUpperCase())
          : winName + ' WIPES THE FIELD';
        how.textContent = winName + ' eliminated every opposing life.';
      } else {
        how.textContent = winName + ' captured the enemy heart.';
      }
    }
  }

  // ============================================================
  //  Transport wiring — DOM controls emit the legacy chat chars +
  //  the cabinet's s:/v: whole-string commands.
  // ============================================================
  function togglePlay() { send(' '); }
  // (speed chips + their speed→command map live in the shared chrome)
  $('btn-play').addEventListener('click', togglePlay);
  $('btn-restart').addEventListener('click', function () { send(','); });
  $('btn-back').addEventListener('click', function () { send('b'); });
  $('btn-fwd').addEventListener('click', function () { send('.'); });
  $('btn-end').addEventListener('click', function () { send('e'); });
  $('btn-loop').addEventListener('click', function () { send('r'); });
  $('btn-skip').addEventListener('click', function () { send('f'); });

  // click-to-seek: map x-fraction to a tick and send s:<tick>
  // Map an x-fraction of the scrubber onto the shown [startTick, maxTick] axis
  // and seek there. One place, shared by a live click and by a click that had
  // to wait for the first frame.
  function seekToFraction(s, frac) {
    var st = Math.max(0, s.st || 0);
    var mx = Math.max(st + 1, s.mx || 1);
    send('s:' + (st + Math.round(frac * (mx - st))));
  }

  $('scrub').addEventListener('click', function (ev) {
    var rect = this.getBoundingClientRect();
    var frac = Math.min(1, Math.max(0, (ev.clientX - rect.left) / rect.width));
    // The axis lives on the frame, so a click before the first frame cannot be
    // mapped yet — QUEUE it (onFrame flushes SEEK_FRAC) rather than dropping
    // it. A dropped first click is invisible: the board is already drawn, the
    // transport looks alive, and the viewer just does not move.
    if (!lastState || !lastState.en) { SEEK_FRAC = frac; return; }
    seekToFraction(lastState, frac);
  });


  // keyboard shortcuts mirror the transport
  window.addEventListener('keydown', function (ev) {
    if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
    var k = ev.key;
    if (k === ' ') { ev.preventDefault(); togglePlay(); }
    else if (k === ',' || k === '<') send(',');
    else if (k === '.' || k === '>') send('.');
    else if (k === 'b') send('b');
    else if (k === 'e') send('e');
    else if (k === 'r') send('r');
    else if (k === 'f') send('f');
    else if (k === '+' || k === '=') send('+');
    else if (k === '-' || k === '_') send('-');
    else if (k === 'o') setSpoilers(!getSpoilers());
    // No view keys. The board is a fixed 1400x1400 square that is always
    // letterboxed whole into the frame, so the starter's z/x/0 zoom and its
    // arrow-key pan were removed along with #viewpanel.
    else if (k >= '1' && k <= '9') send(k);
    // keydown never crosses the iframe boundary: relay Esc to the league
    // shell, which relays it on to the Observatory theater host.
    else if (k === 'Escape') postToShell('esc');
  });

  // Click a soldier on the board to select it (mirrors the squad-pip lens, but
  // for anyone visible on the arena). The board canvas draws ONLY the zoomable
  // map layer, letterboxed by broadcast_core; chrome (scoreboard, transport) are
  // HTML overlays, so a canvas click is always a MAP-space click. Invert the
  // core's letterbox transform to recover native map pixels, then hand them to
  // clickMap — the server hit-tests the soldier footprint and toggles selection.
  // ---- no zoom, no pan ---------------------------------------------------
  // The starter's zoom + pan block (mouse wheel, Safari gesture events, touch
  // pinch, drag-to-pan, dblclick-to-refit and the touch-action sync that went
  // with them) is REMOVED with #viewpanel: this board is a fixed 1400x1400
  // square that is always letterboxed whole into the frame, so there is
  // nowhere to pan to, and with the zoom bar gone there would be no visible
  // control to get back out with. broadcast_core.js keeps its zoom/pan
  // implementation verbatim, simply never driven — the core stays fitted, so
  // the click mapping below is the identity letterbox transform.
  canvas.addEventListener('click', function (ev) {
    var rect = canvas.getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    // getBoundingClientRect is CSS px; the core's transform lives in the same
    // CSS space (offsetX/offsetY/scale are computed against clientWidth/Height,
    // NOT the dpr-scaled backing store), so no devicePixelRatio factor here.
    var cssX = ev.clientX - rect.left;
    var cssY = ev.clientY - rect.top;
    var t = core.getTransform();
    if (!t || !t.scale) return;
    var mapX = Math.round((cssX - t.offsetX) / t.scale);
    var mapY = Math.round((cssY - t.offsetY) / t.scale);
    // Ignore clicks in the letterbox bands (outside the drawn map).
    if (mapX < 0 || mapY < 0 || mapX >= t.nativeW || mapY >= t.nativeH) return;
    core.clickMap(mapX, mapY);
  });

  // ============================================================
  //  Fixed-aspect fit: size the composition to the board's native aspect
  //  inside the embed box, then scale the whole thing (board + overlays) as
  //  one unit. Chrome sizes off the STAGE width, so overlays stay locked to
  //  the graphics at any container shape (§2, L82 bounded-embed).
  // ============================================================
  function relayout() {
    var boxW = viewport.clientWidth, boxH = viewport.clientHeight;
    if (!boxW || !boxH) return;
    // The board region (game action) fits the board aspect into the box BETWEEN a
    // reserved top band (the scorebug) and bottom band (the transport), so neither
    // ever sits over play. Each band's pixel height depends on --hudscale (→ board
    // width) and the board fit depends on the bands, so iterate to a FIXED POINT:
    // stop as soon as a pass measures the same bands it was laid out with. Two
    // passes settle a container resize, but a MAP-ASPECT change (the 1.874:1
    // arena → a square four-team board) swings --hudscale far enough that the
    // second pass is still reserving the old bands, which would leave the board
    // a couple of percent off its true aspect — visible as thin dead strips.
    var scorebug = document.getElementById('scorebug');
    var transport = document.getElementById('transport');
    var root = document.documentElement;
    var topBand = parseFloat(getComputedStyle(root).getPropertyValue('--topband')) || 0;
    var band = parseFloat(getComputedStyle(root).getPropertyValue('--band')) || 0;
    var stageW = 0, stageH = 0;
    for (var pass = 0; pass < 4; pass++) {
      var prevTop = topBand, prevBand = band;
      var availH = Math.max(1, boxH - topBand - band);
      var boardW, boardH;
      if (boxW / availH > BOARD_ASPECT) {
        boardH = availH; boardW = Math.round(availH * BOARD_ASPECT);
      } else {
        boardW = boxW; boardH = Math.round(boxW / BOARD_ASPECT);
      }
      stageW = boardW; stageH = boardH + topBand + band;
      stage.style.width = stageW + 'px';
      stage.style.height = stageH + 'px';
      // One scale for the whole composition: chrome was authored against a
      // ~760px-wide reference board, so --hudscale is the board's on-screen width
      // over that reference (clamped so a huge featured embed doesn't bloat the
      // chrome and a tiny 360px floor stays legible).
      var scale = Math.max(0.5, Math.min(1.6, boardW / 760));
      root.style.setProperty('--hudscale', scale.toFixed(3));
      stage.classList.toggle('tiny', boardW <= 620);
      // Measure each band's natural height → reserve exactly that.
      topBand = scorebug ? scorebug.offsetHeight : 0;
      band = transport ? transport.offsetHeight : 0;
      root.style.setProperty('--topband', topBand + 'px');
      root.style.setProperty('--band', band + 'px');
      if (Math.abs(topBand - prevTop) < 0.5 && Math.abs(band - prevBand) < 0.5) break;
    }
    core.setViewportFit();
  }
  var ro = new ResizeObserver(relayout);
  ro.observe(viewport);
  window.addEventListener('resize', relayout);

  // The context the appended atari-57 block reads the classic chrome
  // through. Declared here (hoisted `var`, so onFrame sees it however early
  // the first frame lands) rather than duplicating any of it: the game block
  // must not re-implement naming, escaping, feed insertion or the transport.
  A57_CTX = {
    $: $, C: C, esc: esc, fmt: fmt, send: send,
    teamCol: teamCol, activeTeams: activeTeams, teamOf: teamOf,
    teamName: teamName, rosterName: rosterName, shortName: shortName,
    pushFeed: pushFeed, banner: banner, togglePov: togglePov, FPS: FPS,
    getState: function () { return lastState; }
  };
  if (window.Atari57Chrome) window.Atari57Chrome.install(A57_CTX);

  // The WORST-CASE TEXT hook. docker_smoke.sh runs with no ANTHROPIC_API_KEY,
  // so every replay CI produces carries only the baselines' fixed `say`
  // strings and nothing in CI would otherwise exercise the stance chips, the
  // feed at full cap or the NEW RECORD banner. tools/ci/renderer_fixture.html
  // drives THIS page — the real shipped one, not a re-implementation
  // (particle-worlds 46cf69d, 2026-08-26) — through its own render path with
  // full-cap strings on all four seats at once. It shims the FRAME SOURCE and
  // nothing else: every pixel below it is the page's own.
  window.__a57TestFrame = function (text) { onFrame(text); };

  relayout();
  core.start();
})();
</script>
<!-- ============================================================
     atari-57 additions to the inherited coworld-ctf chrome
     ============================================================
     Everything above this banner is the starter's broadcast page, edited only
     where the cabinet demands and always behind A57_MODE: the scorebug
     plates' CONTENTS, the endcard's stat columns and its verdict branch on
     A57_MODE, which latches on the first frame that carries the `a57` block.

     REMOVED from the starter's page, and only these: #viewpanel (with
     #minimap, #minimap-canvas, #zoombar, #zoom-out, #zoom-in, #zoom-slider,
     #zoom-read), #fpv (with #fpv-canvas, #fpv-hud, #fpv-name, #fpv-hp,
     #fpv-gear, #fpv-map, #fpv-map-canvas, #fpv-cap, #fpv-grip) and #povBadge
     — plus the JS and CSS that drove them, and the whole view WIRING that fed
     the panel: the z/x/0 and arrow-key view bindings, the wheel/gesture/pinch/
     drag/dblclick handlers, and the zoomAt/setZoom/panBy/panByMap/panTo/
     resetView/attachMinimap routing in replay-viewer/static_replay.js and
     static_replay_worker.js. The board is a fixed 1400x1400
     square that always fits the frame, so the zoom bar and minimap exist for
     nothing; and there is no first person in a cabinet.
     broadcast_core.js itself is untouched — its zoom/pan/minimap code stays in
     the file verbatim, simply never driven.

     Nothing here touches the transport band. relayout() still owns
     --hudscale, --topband and --band on :root; the endcard still stops at
     bottom: var(--band, 0px) and is still dismissed by every seek; and every
     scrubber beat this block draws is a LABELLED, CLICKABLE BUTTON that seeks
     on click, styled for EVERY kind the sim emits — life_lost, screen_clear,
     record, lane_over and over. The builder carries an a57 prefix precisely
     so it can never be shadowed by the chrome alias block's own hoisted
     declaration of the shared one (cogame-tandem, 2026-08-23).
     ============================================================ -->
<style>
/* --- scorebug: score headline, screen chip, points line, lives pips ----- */
/* The plate name must survive a 360px featured-match iframe: it grows into
   whatever room the plate has and ellipsises only when it genuinely runs out,
   never collapsing to a bare "…". */
.plate-name {
  flex: 1 1 auto;
  min-width: 3.2em;
  overflow: hidden;
  text-overflow: ellipsis;
}
.plate .scrchip {
  font-family: var(--pixfont);
  font-size: calc(11 * var(--u));
  line-height: 1;
  min-width: calc(34 * var(--u));
  text-align: center;
  padding: calc(3 * var(--u)) calc(4 * var(--u));
  background: rgba(12, 9, 6, 0.55);
  color: var(--paper-dim);
  letter-spacing: 0.06em;
}
.plate .scrchip.own { opacity: 0.45; text-decoration: line-through; }
.plate .recpip {
  font-family: var(--finefont);
  font-size: calc(7 * var(--u));
  letter-spacing: 0.12em;
  padding: 0 calc(3 * var(--u));
  color: var(--stage-lo);
  background: var(--amber);
  animation: a57-rec 1.1s steps(2, end) infinite;
}
@keyframes a57-rec { 50% { opacity: 0.35; } }
.plate .a57-sub {
  display: flex;
  align-items: center;
  gap: calc(6 * var(--u));
  margin-top: calc(2 * var(--u));
}
.plate.side-r .a57-sub { flex-direction: row-reverse; }
.plate .a57-pts {
  font-family: var(--pixfont);
  font-size: calc(9 * var(--u));
  color: var(--paper-dim);
  white-space: nowrap;
}
.plate .a57-lbl { text-transform: uppercase; letter-spacing: 0.08em; }
.plate .a57-pips { display: inline-flex; gap: calc(2 * var(--u)); }
.plate .a57-pip {
  display: inline-block;
  width: calc(6 * var(--u));
  height: calc(6 * var(--u));
  background: var(--tc, var(--amber));
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.35);
}
.plate .a57-pip.spent { background: rgba(242, 232, 216, 0.16); }
.plate.over { opacity: 0.62; }
/* The ROM chip under the clock: "one ROM per round, announced" made visible. */
#a57-rom {
  font-family: var(--finefont);
  font-size: calc(7 * var(--u));
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--amber);
  opacity: 0.9;
  margin-top: calc(1 * var(--u));
}
/* The stance legend: what the four chips on the board mean. It lives INSIDE
   #chrome and is anchored ABOVE the transport band — never over it. */
#a57-legend {
  position: absolute;
  left: calc(8 * var(--u));
  bottom: calc(var(--band, 0px) + 8 * var(--u));
  display: flex;
  gap: calc(6 * var(--u));
  font-family: var(--finefont);
  font-size: calc(7 * var(--u));
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--paper-dim);
  background: rgba(12, 9, 6, 0.5);
  padding: calc(2 * var(--u)) calc(5 * var(--u));
  pointer-events: none;
  z-index: 4;
}
#a57-legend b { color: var(--tc, var(--paper)); font-weight: 600; }
/* --- speech bubbles: a RESERVED band across the top of the board -------- */
/* Rows [0, 2) of the 35-tile board, above BOTH top quadrants. A bubble is
   never positioned relative to an avatar (cogchemists, 2026-08-24) and can
   never cover play: the band is a fixed slice of the board's own height, it
   clips its own overflow, and each bubble ellipsises inside its third of the
   width, so a full-cap 48-rune `say` has nowhere to spill. */
#a57-bubbles {
  position: absolute;
  left: 0;
  right: 0;
  top: var(--topband, 0px);
  height: calc((100% - var(--topband, 0px) - var(--band, 0px)) * 2 / 35);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: calc(4 * var(--u));
  padding: 0 calc(4 * var(--u));
  overflow: hidden;
  pointer-events: none;
  z-index: 4;
}
#a57-bubbles .a57-bubble {
  flex: 0 1 auto;
  min-width: 0;
  max-width: 32%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-family: var(--finefont);
  font-size: calc(7 * var(--u));
  letter-spacing: 0.04em;
  padding: calc(1 * var(--u)) calc(4 * var(--u));
  background: rgba(12, 9, 6, 0.72);
  color: var(--paper);
}
#a57-bubbles .a57-bubble b { font-weight: 600; }
/* --- scrubber beats: one rule per kind the sim emits -------------------- */
button.beat-marker {
  -webkit-appearance: none;
  appearance: none;
  border: 0;
  padding: 0;
  cursor: pointer;
  background: var(--tc, var(--paper-dim));
}
button.beat-marker:focus-visible { outline: 1px solid var(--amber); }
.beat-marker.life_lost { height: calc(6 * var(--u)); opacity: 0.9; }
.beat-marker.life_lost.red { background: var(--red); }
.beat-marker.life_lost.blue { background: var(--blue); }
.beat-marker.life_lost.green { background: var(--green); }
.beat-marker.life_lost.yellow { background: var(--yellow); }
.beat-marker.screen_clear { width: calc(3 * var(--u)); height: calc(12 * var(--u)); background: var(--paper); }
.beat-marker.record {
  width: calc(3 * var(--u));
  height: calc(14 * var(--u));
  background: var(--amber);
  box-shadow: 0 0 calc(3 * var(--u)) var(--amber);
}
.beat-marker.lane_over { height: calc(8 * var(--u)); opacity: 0.6; background: var(--paper-dim); }
.beat-marker.over {
  width: calc(4 * var(--u));
  height: calc(14 * var(--u));
  background: var(--paper);
}
/* --- the NEW RECORD banner --------------------------------------------- */
.banner-chip.record {
  border-bottom-color: var(--amber);
  color: var(--amber);
  letter-spacing: 0.18em;
}
.feed-row .a57-note { color: var(--amber); }
.feed-row .a57-say { color: var(--paper); font-style: italic; }
.ec-rec {
  font-family: var(--finefont);
  font-size: calc(7 * var(--u));
  letter-spacing: 0.1em;
  padding: 0 calc(3 * var(--u));
  margin-left: calc(3 * var(--u));
  color: var(--stage-lo);
  background: var(--amber);
}
/* --- legible at 360px --------------------------------------------------- */
/* At 360px a lane is 175 screen pixels. The tiles, sprites, avatars, quadrant
   frames, aliases and lives pips all stay; the per-plate raw-points line and
   the screen chip collapse onto one line, the stance legend goes, and the
   NEW RECORD banner stays — it is the one thing a 360px viewer must not
   miss. */
#stage.tiny .plate .a57-pts { display: none; }
#stage.tiny .plate .scrchip { min-width: 0; font-size: calc(9 * var(--u)); }
#stage.tiny #a57-legend { display: none; }
#stage.tiny #a57-bubbles { display: none; }
@media (max-width: 640px) {
  .plate .lives-label { display: none; }
  .plate .a57-pts { display: none; }
}
</style>
<script>
(function () {
  'use strict';
  // Every name here carries an a57 prefix ON PURPOSE. The page's chrome alias
  // block declares the shared beat builder with a hoisted `var`, so a
  // game-block function of that same name is silently swallowed by it and the
  // scrubber ends up with unlabelled div markers that never seek
  // (cogame-tandem, 2026-08-23). tests/test_viewer.nim asserts no name
  // declared below this banner collides with that alias list.
  var CTX = null;
  var a57Placed = {};       // "tick|kind|team" -> true (dedup)
  var a57SeenStance = {};

  function a57El(id) { return document.getElementById(id); }

  function a57ScrubGeometry(s) {
    var st = Math.max(0, s.st || 0);
    var mx = Math.max(st + 1, s.mx || 1);
    return { st: st, span: mx - st };
  }

  function a57MarkBeat(s, tick, kind, team, label) {
    var key = tick + '|' + kind + '|' + (team || '');
    if (a57Placed[key]) return;
    a57Placed[key] = true;
    var scrub = a57El('scrub');
    if (!scrub) return;
    var g = a57ScrubGeometry(s);
    var el = document.createElement('button');
    el.type = 'button';
    el.className = 'beat-marker ' + kind + (team ? ' ' + team : '');
    el.style.left =
      (Math.min(1, Math.max(0, (tick - g.st) / g.span)) * 100) + '%';
    el.title = label;
    el.setAttribute('aria-label', label);
    el.addEventListener('click', function (ev) {
      ev.stopPropagation();
      CTX.send('s:' + tick);
    });
    scrub.appendChild(el);
  }

  function a57FeedRow(html, cls) {
    var row = document.createElement('div');
    row.className = 'feed-row' + (cls ? ' ' + cls : '');
    row.innerHTML = html;
    CTX.pushFeed(row);
  }

  function a57Alias(s, lane) {
    var roster = s.roster || [];
    for (var i = 0; i < roster.length; i++) {
      if (roster[i].s === lane) return roster[i].alias || roster[i].name;
    }
    return '#' + lane;
  }

  function a57Secs(s, tick) {
    var fps = (CTX && CTX.FPS) || 24;
    return (Math.max(0, tick - (s.st || 0)) / fps).toFixed(1) + ' s';
  }

  // Every beat and feed row the cabinet produces. Returns true when the event
  // was handled here, so the inherited switch never doubles it.
  function a57Event(e, s, ctx) {
    CTX = ctx;
    var who = String(e.team || '').toUpperCase();
    switch (e.k) {
      case 'life_lost':
        a57MarkBeat(s, e.t, 'life_lost', e.team,
          who + ' loses a life at ' + a57Secs(s, e.t) + ' — click to jump here');
        a57FeedRow('<span class="who ' + (e.team || '') + '">' + CTX.esc(who) +
          '</span><span class="glyph">\u00b7</span>' +
          '<span class="badge">loses a life \u2014 ' + (e.livesLeft || 0) +
          ' left</span>');
        return true;
      case 'screen_clear':
        a57MarkBeat(s, e.t, 'screen_clear', e.team,
          who + ' clears the screen at ' + a57Secs(s, e.t) +
          ' — click to jump here');
        a57FeedRow('<span class="who ' + (e.team || '') + '">' + CTX.esc(who) +
          '</span><span class="glyph">\u25b8</span>' +
          '<span class="badge">clears the screen \u2014 +' + (e.bonus || 0) +
          '</span>');
        CTX.banner(who + ' CLEARS SCREEN ' + ((e.screen || 2) - 1), e.team);
        return true;
      case 'record':
        a57MarkBeat(s, e.t, 'record', e.team,
          'New record — ' + a57Secs(s, e.t) + ' — ' + who + ' passes ' +
          (e.par || 0));
        a57FeedRow('<span class="who ' + (e.team || '') + '">' + CTX.esc(who) +
          '</span><span class="glyph">\u25b8</span>' +
          '<span class="a57-note">passes the record \u2014 ' +
          (e.points || 0) + '</span>');
        CTX.banner(who + ' \u2014 NEW RECORD \u2014 ' + (e.points || 0) +
          ' (par ' + (e.par || 0) + ')', 'record');
        return true;
      case 'lane_over':
        a57MarkBeat(s, e.t, 'lane_over', e.team,
          who + ' GAME OVER at ' + a57Secs(s, e.t) + ' — click to jump here');
        a57FeedRow('<span class="who ' + (e.team || '') + '">' + CTX.esc(who) +
          '</span><span class="glyph">\u00b7</span>' +
          '<span class="badge">game over \u2014 ' + (e.points || 0) +
          '</span>');
        return true;
      case 'over':
        a57MarkBeat(s, e.t, 'over', '', 'The credit is spent — click to jump here');
        return false;   // the end-card is state-driven; let the page see it too
      case 'say':
        if (e.say) {
          a57FeedRow('<span class="who ' + (e.team || '') + '">' +
            CTX.esc(String(e.alias || who)) + '</span>' +
            '<span class="glyph">:</span>' +
            '<span class="a57-say">' + CTX.esc(e.say) + '</span>');
        }
        return true;
      case 'pickup':
      case 'chain':
      case 'near_miss':
        return true;    // continuous scoring; the BOARD is that readout
    }
    return false;
  }

  // The policy lines: each turn's stance `note` is what a spectator actually
  // sees the LLM doing, so it gets its own feed row.
  function a57Stances(s) {
    var records = s.stances;
    if (!records || !records.length) return;
    for (var i = 0; i < records.length; i++) {
      var d = records[i];
      var key = d.turn + ':' + d.seat;
      if (a57SeenStance[key]) continue;
      a57SeenStance[key] = true;
      if (!d.note) continue;
      var team = ((s.roster || [])[d.seat] || {}).team || '';
      a57FeedRow('<span class="who ' + team + '">' +
        CTX.esc(String(d.alias || '')) + '</span>' +
        '<span class="glyph">:</span><span class="a57-note">' +
        CTX.esc(String(d.mode || '').toUpperCase()) +
        (d.zone && d.zone !== 'none'
          ? '\u00b7' + CTX.esc(String(d.zone).toUpperCase()) : '') +
        ' \u2014 ' + CTX.esc(d.note) + '</span>');
    }
  }

  function a57EnsureRomChip() {
    if (a57El('a57-rom')) return a57El('a57-rom');
    var clock = a57El('clock');
    if (!clock) return null;
    var el = document.createElement('div');
    el.id = 'a57-rom';
    clock.appendChild(el);
    return el;
  }

  function a57EnsureLegend() {
    if (a57El('a57-legend')) return a57El('a57-legend');
    var chrome = a57El('chrome');
    if (!chrome) return null;
    var el = document.createElement('div');
    el.id = 'a57-legend';
    chrome.appendChild(el);
    return el;
  }

  function a57EnsureBubbles() {
    if (a57El('a57-bubbles')) return a57El('a57-bubbles');
    var chrome = a57El('chrome');
    if (!chrome) return null;
    var el = document.createElement('div');
    el.id = 'a57-bubbles';
    el.setAttribute('aria-live', 'off');
    chrome.appendChild(el);
    return el;
  }

  function a57Frame(s, ctx, jumped) {
    CTX = ctx;
    if (jumped) { a57Placed = {}; a57SeenStance = {}; }
    var a57 = s.a57 || {};
    // The cartridge is on screen at ALL times: which ROM is loaded is the
    // round's headline, and the manifest announced it before the round.
    var chip = a57EnsureRomChip();
    if (chip) {
      var turn = (s.turn || 0) + 1;
      var turns = s.turns || 0;
      var text = String(a57.rom || '').toUpperCase() +
        ' \u00b7 par ' + (a57.par || 0) +
        (turns > 0 ? ' \u00b7 turn ' + Math.min(turn, turns) + '/' + turns : '');
      if (chip.textContent !== text) chip.textContent = text;
    }
    // The stance legend: four chips, one per lane, in the lane's colour.
    var legend = a57EnsureLegend();
    if (legend) {
      var lanes = a57.lanes || [];
      var parts = [];
      for (var i = 0; i < lanes.length; i++) {
        var ln = lanes[i];
        if (!ln.mode) continue;
        parts.push('<span style="color:' +
          (CTX.teamCol(ln.team) || '#f2e8d8') + '"><b>' +
          CTX.esc(String(ln.alias || '')) + '</b> ' +
          CTX.esc(String(ln.mode).toUpperCase()) +
          (ln.zone && ln.zone !== 'none'
            ? '\u00b7' + CTX.esc(String(ln.zone).toUpperCase()) : '') +
          '</span>');
      }
      var html = parts.join('');
      if (legend.innerHTML !== html) legend.innerHTML = html;
    }
    // The speech-bubble band: what a lane SAID, in a reserved strip across the
    // top of the board (rows [0, 2) of 35) rather than over an avatar. The sim
    // owns both the 2.5 s life and the cap of three (src/lane/broadcast.nim),
    // so this only paints whatever is live on THIS frame — which makes a seek
    // land on exactly the bubbles the recorded tick had.
    var band = a57EnsureBubbles();
    if (band) {
      var bubbles = a57.bubbles || [];
      var lanes2 = a57.lanes || [];
      var speech = '';
      for (var q = 0; q < bubbles.length; q++) {
        var bub = bubbles[q];
        var ln2 = lanes2[bub.lane] || {};
        var col = CTX.teamCol(ln2.team) || '#f2e8d8';
        speech += '<span class="a57-bubble" style="color:' + col + '">' +
          '<b>' + CTX.esc(String(ln2.alias || '')) + '</b> \u201c' +
          CTX.esc(String(bub.say || '')) + '\u201d</span>';
      }
      if (band.innerHTML !== speech) band.innerHTML = speech;
    }
    a57Stances(s);
    // The up-front beat timeline (shipped ONCE by the server) places every
    // marker before playback reaches it, as labelled buttons.
    if (s.beats && s.beats.length) {
      for (var b = 0; b < s.beats.length; b++) {
        var beat = s.beats[b];
        var bw = String(beat.team || '').toUpperCase();
        if (beat.k === 'life_lost') {
          a57MarkBeat(s, beat.t, 'life_lost', beat.team,
            bw + ' loses a life at ' + a57Secs(s, beat.t) +
            ' — click to jump here');
        } else if (beat.k === 'screen_clear') {
          a57MarkBeat(s, beat.t, 'screen_clear', beat.team,
            bw + ' clears the screen at ' + a57Secs(s, beat.t) +
            ' — click to jump here');
        } else if (beat.k === 'record') {
          a57MarkBeat(s, beat.t, 'record', beat.team,
            'New record — ' + a57Secs(s, beat.t) + ' — ' + bw + ' passes ' +
            (beat.par || 0));
        } else if (beat.k === 'lane_over') {
          a57MarkBeat(s, beat.t, 'lane_over', beat.team,
            bw + ' GAME OVER at ' + a57Secs(s, beat.t) +
            ' — click to jump here');
        } else if (beat.k === 'over') {
          a57MarkBeat(s, beat.t, 'over', '',
            'The credit is spent — click to jump here');
        }
      }
    }
  }

  window.Atari57Chrome = {
    install: function (ctx) { CTX = ctx; },
    frame: a57Frame,
    event: a57Event
  };
})();
</script>

</body>
